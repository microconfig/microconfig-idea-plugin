import org.jetbrains.intellij.platform.gradle.TestFrameworkType

plugins {
    id 'java'
    id 'idea'
    alias(libs.plugins.intellij.platform)
}

group = 'io.microconfig'
version = '1.7.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '233'
            untilBuild = provider { null }
        }
        changeNotes = """
          &#183; Update microconfig core to ${libs.versions.microconfig.get()}<br>
          &#183; Requires IntelliJ 2023.3+ (Java 17)<br>
          &#183; Spread the word about microconfig if you enjoy using it :)<br>
          """
    }
    pluginVerification {
        ides {
            recommended()
        }
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2023.3'
        testFramework TestFrameworkType.Platform.INSTANCE
        testFramework TestFrameworkType.JUnit5.INSTANCE
    }

    implementation platform(libs.spring.boot.bom)

    implementation(variantOf(libs.microconfig) { classifier('all') }) { transitive = false }

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.bundles.junit, libs.mockito
    testRuntimeOnly libs.junit.platform.launcher, libs.junit4
}

processResources {
    inputs.property 'version', version
    filesMatching('**/greeter/version.txt') {
        expand(version: version)
    }
}

test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}
