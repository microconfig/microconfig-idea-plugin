plugins {
    id 'java'
    id 'idea'
    alias(libs.plugins.intellij.platform)
}

group = 'io.microconfig'
version = '1.7.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    intellijPlatform {
        defaultRepositories()
    }
}

intellijPlatform {
    pluginConfiguration {
        ideaVersion {
            sinceBuild = '223'
            untilBuild = provider { null }
        }
        changeNotes = """
          &#183; Update microconfig core to ${libs.versions.microconfig.get()}<br>
          &#183; Requires IntelliJ 2022.3+ (Java 17)<br>
          &#183; Spread the word about microconfig if you enjoy using it :)<br>
          """
    }
    pluginVerification {
        ides {
            create('IC', '2022.3.3')
            create('IU', '2026.2.3')
        }
    }
}

dependencies {
    intellijPlatform {
        intellijIdeaCommunity '2022.3'
    }

    implementation platform(libs.spring.boot.bom)

    implementation(variantOf(libs.microconfig) { classifier('all') }) { transitive = false }

    compileOnly libs.lombok
    annotationProcessor libs.lombok

    testImplementation platform(libs.spring.boot.bom)
    testImplementation libs.bundles.junit, libs.mockito
    testRuntimeOnly libs.junit.platform.launcher
}

test {
    useJUnitPlatform()
    exclude '**/*IT.class'
}
